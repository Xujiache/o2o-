upstream o2o_server {
  server server:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass http://o2o_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }

  location /minio/ {
    proxy_pass http://minio:9000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# TLS production example:
# 1. Put certificates under deploy/nginx/certs/fullchain.pem and privkey.pem.
# 2. Add a second server block listening on 443 ssl http2 with the same locations.
# 3. Redirect port 80 to https only after certificates and domain DNS are ready.
