services:
  server:
    image: o2o/server:${O2O_SERVER_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    env_file:
      - path: ./.env.prod
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:-https://o2o.example.com}
      GATEWAY_PUBLIC_BASE_URL: ${GATEWAY_PUBLIC_BASE_URL:-https://o2o.example.com}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-o2o}
      MYSQL_USER: ${MYSQL_USER:-o2o}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_mysql_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_redis_password}
      REDIS_DB: ${REDIS_DB:-0}
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-change_me_mongo_root_password}@mongodb:27017/${MONGO_DATABASE:-o2o}?authSource=admin
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-change_me_minio_user}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_me_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-o2o-prod}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-https://o2o.example.com/minio}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false'
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    expose:
      - '3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/v1/pub/health']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: o2o-nginx-prod
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - frontend
      - backend

  mysql:
    image: mysql:8.0
    container_name: o2o-mysql-prod
    restart: unless-stopped
    env_file:
      - path: ./.env.prod
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_mysql_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-o2o}
      MYSQL_USER: ${MYSQL_USER:-o2o}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_mysql_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_allowed_packet=128M
      - --sql_mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: o2o-redis-prod
    restart: unless-stopped
    env_file:
      - path: ./.env.prod
        required: false
    command: sh -c 'redis-server --requirepass "$${REDIS_PASSWORD:-change_me_redis_password}" --appendonly yes'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD:-change_me_redis_password}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  mongodb:
    image: mongo:7
    container_name: o2o-mongo-prod
    restart: unless-stopped
    env_file:
      - path: ./.env.prod
        required: false
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me_mongo_root_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-o2o}
    volumes:
      - mongo_data:/data/db
      - ./init/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: o2o-minio-prod
    restart: unless-stopped
    env_file:
      - path: ./.env.prod
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change_me_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  minio_data:
  nginx_logs:

networks:
  frontend:
    name: o2o-prod-frontend
  backend:
    name: o2o-prod-backend
    internal: true
